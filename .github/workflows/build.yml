name: build

# Builds a non-privileged, multi-arch HestiaCP image and pushes it to GHCR.
# The installer pulls HestiaCP's `release` branch, so each build is the latest
# stable HestiaCP.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild to pick up the latest HestiaCP + base image security updates.
  schedule:
    - cron: "0 4 * * 1"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/hestiacp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
